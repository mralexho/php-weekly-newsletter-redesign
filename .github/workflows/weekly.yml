name: Weekly PHP Weekly conversion

on:
  schedule:
    # Thursdays 09:00 UTC — PHP Weekly typically ships on Wednesdays.
    - cron: "0 9 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  convert-and-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Convert latest issue and send
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: node src/cli.js

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last-issue.json
          git diff --staged --quiet || git commit -m "chore: record last sent issue"
          git push
